<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A2647" />
  <title>Offline — Vangitech</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb; color: #1f2937; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; padding: 2rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
    }
    .card { text-align: center; max-width: 420px; }
    img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #0A2647; }
    p { color: #6b7280; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(135deg, #1a56db, #059669); color: #fff; border: none;
      padding: 14px 32px; border-radius: 12px; font-size: 1rem; font-weight: 600;
      cursor: pointer; min-height: 48px;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="Vangitech" />
    <h1>You&rsquo;re offline</h1>
    <p>Check your internet connection and try again. Your Vangitech app will pick up right where you left off.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
