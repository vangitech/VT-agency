server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Quote-request file uploads (multipart/form-data)
  client_max_body_size 10m;

  # Security headers (CSP intentionally omitted — inline styles/scripts in
  # the Vite bundle need testing before enforcing one)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # Never cache the SPA shell — always serve fresh index.html
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
